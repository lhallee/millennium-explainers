<svg viewBox="0 0 640 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Primes determine zeta, zeta determines its zeros, and the zeros count the primes.">
  <defs>
    <marker id="demo-map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g font-size="14" fill="currentColor" text-anchor="middle">
    <rect x="20" y="30" width="150" height="50" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.45"/>
    <text x="95" y="60" font-weight="600">The primes</text>
    <rect x="245" y="30" width="150" height="50" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.45"/>
    <text x="320" y="60" font-weight="600">Zeta</text>
    <rect x="470" y="30" width="150" height="50" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.45"/>
    <text x="545" y="60" font-weight="600">Its zeros</text>
    <line x1="172" y1="55" x2="242" y2="55" stroke="currentColor" marker-end="url(#demo-map-arrow)"/>
    <line x1="397" y1="55" x2="467" y2="55" stroke="currentColor" marker-end="url(#demo-map-arrow)"/>
    <path d="M545 82 C545 120, 95 120, 95 84" fill="none" stroke="currentColor" stroke-dasharray="5 4" marker-end="url(#demo-map-arrow)"/>
    <text x="207" y="46" font-size="12" opacity="0.75">Euler product</text>
    <text x="432" y="46" font-size="12" opacity="0.75">continuation</text>
    <text x="320" y="124" font-size="12" opacity="0.75">explicit formula</text>
  </g>
</svg>
