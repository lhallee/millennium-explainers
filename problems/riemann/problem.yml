id: riemann
title: The Riemann Hypothesis
subtitle: From counting primes to the two proofs of 2026, step by step
lede: >-
  The Riemann Hypothesis says that the primes are spread as evenly as they can be. This page starts from
  counting primes and ends with the two proofs released on 2026-11-20: a trace formula on the idele class
  group, and a descendant of Stepanov's method over the integers. Every step comes with the reason it is
  taken.
